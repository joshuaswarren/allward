# Generates Sources/CAllwardSSH/include/allward_ssh.h from the Rust source.
#
# The header is committed and reviewed; `scripts/rust-header-drift.sh` regenerates
# it and diffs, so the Swift declarations cannot drift from the Rust that backs
# them. See docs/evidence/SANDBOX.md for why this is generated rather than typed.
language = "C"
include_guard = "ALLWARD_SSH_H"
documentation = true
documentation_style = "doxy"
cpp_compat = true
header = """
/* Generated by cbindgen from rust/allward-ssh. Do not edit by hand.
 * Regenerate with: bash scripts/rust-header-drift.sh --write
 */"""

[export]
prefix = ""

[parse]
parse_deps = false

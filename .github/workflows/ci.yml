name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate public documentation
        run: python3 scripts/validate-publication.py

  core:
    runs-on: ubuntu-24.04
    container: swift:6.2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Test AllwardCore
        run: swift test --configuration debug --parallel
